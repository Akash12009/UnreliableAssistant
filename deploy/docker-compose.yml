# UNTESTED in the authoring environment (no Docker access). Reference stack for Gate 10/11 + ADR-007:
#   OTel Collector -> Prometheus + Tempo -> Grafana, Redis (cluster-capable), PostgreSQL+pgvector.
# The app currently uses SQLite for state; point UA_REDIS_URL at redis to use the (tested) Redis backend.
services:
  redis:      {image: "redis:7", command: ["redis-server", "--save", "", "--appendonly", "no"], ports: ["6379:6379"]}
  postgres:   {image: "pgvector/pgvector:pg16", environment: {POSTGRES_PASSWORD: change-me}, ports: ["5432:5432"]}
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otel.yaml:ro"]
    ports: ["4317:4317"]
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro"]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true"}
